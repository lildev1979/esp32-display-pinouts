0" font-size="17" fill="#0d1513">TCA9554 (I/O expander)</text><rect x="56" y="702" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="704" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="722" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Type</text><text x="606" text-anchor="end" y="722" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554</text><text x="56" y="752" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="606" text-anchor="end" y="752" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x20</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">PMIC - AXP2101</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x34</text><text x="634" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="626" y="644" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 3</text><text x="634" y="722" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="736" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="738" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="56" y="804" width="1128" height="166" rx="10" fill="#fdf7e8"/><text x="76" y="828" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="852" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-1.8). This is the V1 revision</text><text x="76" y="874" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(SH8601 panel, FT3168 touch), discontinued; boards shipped from 30 May 2026 are V2 (CO5300, CST820, 16-column offset) on the same</text><text x="76" y="896" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">pins and need the -v2 record - check the label on the back. Every pin recorded here is the same in the vendor&#39;s code and on the</text><text x="76" y="918" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">schematic; the disagreements are inside the vendor&#39;s code. The glass has rounded corners whose radius Waveshare does not give, so</text><text x="76" y="940" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the designer draws them square: keep what matters out of the corners, or set a corner radius on the Display tab once it is</text><text x="76" y="962" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">measured. Brightness is a command to the panel, not a backlight pin. Compiled; not run on a board here.</text><text x="56" y="1016" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-amoled-18&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1040" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-amoled-18</text></svg>