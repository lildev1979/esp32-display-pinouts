<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910"><rect width="1240" height="910" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">ESP32-2432S028 &quot;Cheap Yellow Display&quot;, two USB ports, ILI9341</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32   ·   ILI9341 240 x 320   ·   TFT_eSPI   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - SPI (4-wire serial)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK / CLK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI / SDA</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 13</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO / SDO</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 12</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DC / RS</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="56" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">-</text><text x="56" y="440" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - XPT2046</text><rect x="56" y="454" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 25</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 32</text><rect x="48" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO</text><text x="606" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="56" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 33</text><rect x="48" y="576" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="594" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">IRQ / PENIRQ</text><text x="606" text-anchor="end" y="594" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 36</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="350" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">CN1 I2C (GPIO 27 / 22)</text><rect x="634" y="364" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><rect x="56" y="642" width="1128" height="166" rx="10" fill="#fdf7e8"/><text x="76" y="666" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="690" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins are the Sunton CYD&#39;s, which the two-USB board shares (witnessmenow/ESP32-Cheap-Yellow-Display). Stored portrait (240 x 320)</text><text x="76" y="712" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">because the original CYD preset, stored landscape for its own glass, draws this panel squashed and striped. Colour order BGR with</text><text x="76" y="734" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">inversion off is what a user&#39;s own board needed to look as designed (2026-10-21), as an ILI9341 at 240 x 320; touch was not</text><text x="76" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">reported on separately. If the picture is a negative, turn Invert on; if red and blue are swapped, set RGB; if colours look washed</text><text x="76" y="778" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">out, the same notes report a gamma fault on some of these boards. If this preset gives a white screen, the panel is the ST7789</text><text x="76" y="800" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">batch: use the ST7789 preset.</text><text x="56" y="854" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;cyd-2432s028-2usb-ili9341&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="878" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/cyd-2432s028-2usb-ili9341</text></svg>