"332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DC / RS</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="56" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">-</text><text x="56" y="440" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - XPT2046</text><rect x="56" y="454" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 13</text><rect x="48" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO</text><text x="606" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 12</text><text x="56" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 33</text><rect x="48" y="576" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="594" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">IRQ / PENIRQ</text><text x="606" text-anchor="end" y="594" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 36</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="350" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="364" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 34</text><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Led Red (output)</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><rect x="626" y="426" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Led Green (output)</text><text x="1184" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Led Blue (output)</text><text x="1184" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="486" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Boot Button (input)</text><text x="1184" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="56" y="642" width="1128" height="122" rx="10" fill="#fdf7e8"/><text x="76" y="666" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="690" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from LCDWIKI&#39;s Arduino demo instructions (table 2.1) and schematic; colour order and SPI clock from the two community projects</text><text x="76" y="712" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">for this board. Touch shares the display&#39;s SPI bus (CS 33, IRQ 36) and calibrates on first boot. On the E32N40T choose None under</text><text x="76" y="734" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Hardware &gt; Touch. The SD card (CS 5, 18/19/23) and the I2C header (SDA 32, SCL 25) are left out of the kit: a third SPI bus on the</text><text x="76" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">SD pins would share a controller with the panel.</text><text x="56" y="810" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;lcdwiki-e32r40t&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="834" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/lcdwiki-e32r40t</text></svg>