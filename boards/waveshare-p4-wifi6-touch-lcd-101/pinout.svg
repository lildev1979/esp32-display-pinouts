<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="934" viewBox="0 0 1240 934"><rect width="1240" height="934" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-P4   ·   JD9365 800 x 1280   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - MIPI-DSI</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><text x="56" y="290" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="304" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="306" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="324" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="324" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="414" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="428" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="430" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="448" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="448" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 26</text><text x="56" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">WiFiCoprocessor - Wi-Fi co-processor</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="634" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="626" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="392" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="410" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RST</text><text x="1184" text-anchor="end" y="410" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 54</text><rect x="56" y="556" width="1128" height="276" rx="10" fill="#fdf7e8"/><text x="76" y="580" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="604" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel. Pins and the panel&#39;s</text><text x="76" y="626" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">start-up table are from Waveshare&#39;s own BSP (esp32_p4_wifi6_touch_lcd_x) and so are the settings (80 MHz, a VSYNC back porch of 10,</text><text x="76" y="648" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">1500 Mbps a lane: what Waveshare&#39;s ESP-IDF code runs). If the screen stays dark with the backlight lit, try 60 MHz with a VSYNC</text><text x="76" y="670" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">back porch of 12 and 750 Mbps a lane, which is what GFX Library for Arduino&#39;s own definition of the board runs. These boards ship</text><text x="76" y="692" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">with ESP32-P4 chips of both generations. A design on this preset starts on revision 3, which Waveshare&#39;s own Arduino examples for</text><text x="76" y="714" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the board build for; for a chip before revision 3 (the upload says &quot;revision v1.x&quot;), choose that under Hardware &gt; Board &gt; Chip</text><text x="76" y="736" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">revision. The touch controller may answer at 0x14 instead of 0x5D. Wi-Fi is the ESP32-C6 beside the P4, in the kit as the Wi-Fi</text><text x="76" y="758" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">co-processor on the ESP32 core&#39;s own SDIO lines (CLK 18, CMD 19, D0-D3 14-17, reset 54) - Waveshare publish no pins for it, and</text><text x="76" y="780" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">their own Arduino Wi-Fi example uses those defaults; it has to run ESP-Hosted of the core&#39;s release, which the board prints at</text><text x="76" y="802" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">start (see the README). Wi-Fi through it compiles and has not been on a board. Not driven: the TF card, the audio codec, the camera</text><text x="76" y="824" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">connector, and the C6&#39;s Bluetooth; ESP-NOW does not go through the C6.</text><text x="56" y="878" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-p4-wifi6-touch-lcd-101&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="902" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-p4-wifi6-touch-lcd-101</text></svg>