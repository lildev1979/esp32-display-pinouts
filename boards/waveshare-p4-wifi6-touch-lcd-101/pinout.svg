<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670"><rect width="1240" height="670" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-P4   ·   JD9365 800 x 1280   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - MIPI-DSI</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><text x="56" y="290" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="304" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="306" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="324" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="324" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 26</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><rect x="56" y="402" width="1128" height="166" rx="10" fill="#fdf7e8"/><text x="76" y="426" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="450" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel. Pins and the panel&#39;s</text><text x="76" y="472" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">start-up table are from Waveshare&#39;s own BSP (esp32_p4_wifi6_touch_lcd_x) and so are the settings (80 MHz, a VSYNC back porch of 10,</text><text x="76" y="494" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">1500 Mbps a lane: what Waveshare&#39;s ESP-IDF code runs). If the screen stays dark with the backlight lit, try 60 MHz with a VSYNC</text><text x="76" y="516" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">back porch of 12 and 750 Mbps a lane, which is what GFX Library for Arduino&#39;s own definition of the board runs. These boards ship</text><text x="76" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">with ESP32-P4 chips of both generations: the export builds for a chip before revision 3 (see the README for the other). The touch</text><text x="76" y="560" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">controller may answer at 0x14 instead of 0x5D. The TF card, audio codec, camera connector and the ESP32-C6 radio are not driven.</text><text x="56" y="614" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-p4-wifi6-touch-lcd-101&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="638" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-p4-wifi6-touch-lcd-101</text></svg>