<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780"><rect width="1240" height="780" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Guition ESP32-4848S040 (4&quot; 480x480)</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-S3   ·   ST7701 / ST7701S 480 x 480   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - RGB565 parallel (DPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DE</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">VSYNC</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">HSYNC</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PCLK</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">R0 - R4</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11, 12, 13, 14, 0</text><text x="56" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">G0 - G5</text><text x="606" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8, 20, 3, 46, 9, 10</text><rect x="48" y="392" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="410" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">B0 - B4</text><text x="606" text-anchor="end" y="410" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4, 5, 6, 7, 15</text><text x="56" y="440" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS (init only)</text><text x="606" text-anchor="end" y="440" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><rect x="48" y="452" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="470" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK (init only)</text><text x="606" text-anchor="end" y="470" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 48</text><text x="56" y="500" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI (init only)</text><text x="606" text-anchor="end" y="500" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 47</text><rect x="48" y="512" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="530" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="530" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">-</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 45</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="626" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><rect x="56" y="578" width="1128" height="100" rx="10" fill="#fdf7e8"/><text x="76" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="626" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">The ST7701 init sequence is the type 9 one - this board is the reason that type exists, and the panel stays black with any other.</text><text x="76" y="648" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Touch INT and RESET are not brought out, so the GT911 is polled and reset by software. GPIO0 and GPIO3 are strapping pins used as</text><text x="76" y="670" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">RGB data, which is safe: they are outputs only, and not driven until after boot.</text><text x="56" y="724" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;guition-4848s040&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="748" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/guition-4848s040</text></svg>