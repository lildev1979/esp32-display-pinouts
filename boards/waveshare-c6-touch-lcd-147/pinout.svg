<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1256" viewBox="0 0 1240 1256"><rect width="1240" height="1256" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-C6-Touch-LCD-1.47</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-C6   ·   JD9853 172 x 320   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - SPI (4-wire serial)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK / CLK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI / SDA</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DC / RS</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><text x="56" y="410" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - AXS5106L</text><rect x="56" y="424" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="426" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="48" y="486" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="56" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 20</text><text x="56" y="594" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="608" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="610" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 23</text><text x="56" y="658" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="658" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="670" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="688" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="688" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 18 / 19)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SPI (panel and TF card)</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><rect x="626" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 3</text><text x="634" y="474" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="488" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 18 / 19)</text><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="598" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="612" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="614" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">SPI (panel and TF card)</text><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4</text><text x="634" y="722" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="736" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="738" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="1184" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="634" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><rect x="56" y="834" width="1128" height="320" rx="10" fill="#fdf7e8"/><text x="76" y="858" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="882" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board. The Arduino export for it compiles, and nothing in this preset has been seen on the panel.</text><text x="76" y="904" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins, the panel&#39;s register load and the touch panel&#39;s read are from Waveshare&#39;s own demo code (ESP32-C6-Touch-LCD-1.47-Demo.zip,</text><text x="76" y="926" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">read 2026-10-18) and the schematic. The panel is a JD9853 on SPI (SCK 1, MOSI 2, CS 14, DC 15, reset 22, backlight 23 dimmed by</text><text x="76" y="948" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">PWM): no graphics library has a class for this glass, so the export drives it as Waveshare&#39;s Arduino demo does, through GFX Library</text><text x="76" y="970" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">for Arduino&#39;s Arduino_ST7789 with Waveshare&#39;s own register load, a 172 x 320 window at column 34. Touch is an AXS5106L at 0x63 (SDA</text><text x="76" y="992" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">18, SCL 19, INT 21, reset 20), read by the sketch; a finger held on a key stays held between its reports. The QMI8658 IMU (0x6B)</text><text x="76" y="1014" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">shares that I2C bus; its interrupts (GPIO 5 and 6) are not used. The battery is read on GPIO 0 through a 200K/100K divider, so the</text><text x="76" y="1036" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Battery input reads volts. The BOOT button is GPIO 9 (Waveshare&#39;s pin table says 8; their own firmware and the schematic say 9).</text><text x="76" y="1058" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">The TF card slot shares the panel&#39;s SPI lines (SCK 1, MOSI 2; MISO 3 and CS 4 are its own, and the schematic pulls all four up with</text><text x="76" y="1080" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">10K), as Waveshare&#39;s ESP-IDF factory firmware runs it beside the panel on the C6&#39;s one SPI controller. It arrives switched off;</text><text x="76" y="1102" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">switched on under Hardware &gt; Devices, it is started on the panel&#39;s bus once the panel has, at 20 MHz - compiled, and not yet read</text><text x="76" y="1124" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">on a board. If a touch lands mirrored left to right, Invert X under Hardware &gt; Touch is the setting to change; if the colours come</text><text x="76" y="1146" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">out as a negative, untick Invert under Hardware &gt; Display.</text><text x="56" y="1200" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-c6-touch-lcd-147&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1224" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-c6-touch-lcd-147</text></svg>