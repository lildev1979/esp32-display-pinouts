<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1146" viewBox="0 0 1240 1146"><rect width="1240" height="1146" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-P4-WIFI6-Touch-LCD-5</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-P4   ·   HX8394 720 x 1280   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - MIPI-DSI</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><text x="56" y="290" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="304" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="306" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="324" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="324" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="414" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="428" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="430" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="448" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="448" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 26</text><text x="56" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="56" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 7 / 8)</text><rect x="56" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 43</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 44</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="634" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><rect x="626" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="634" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="634" y="440" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">WiFiCoprocessor - Wi-Fi co-processor</text><rect x="634" y="454" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="634" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="626" y="576" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="594" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="594" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="624" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="624" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="636" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="654" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RST</text><text x="1184" text-anchor="end" y="654" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 54</text><rect x="56" y="702" width="1128" height="342" rx="10" fill="#fdf7e8"/><text x="76" y="726" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="750" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel. A user had one running from</text><text x="76" y="772" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">an LCD Wizard export he changed by hand to Waveshare&#39;s own settings and Waveshare&#39;s copy of GFX Library for Arduino; this preset</text><text x="76" y="794" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">carries those settings, read again from Waveshare&#39;s Arduino examples for the board, on the library as it is published: the HX8394</text><text x="76" y="816" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">under Waveshare&#39;s register table, two lanes at 700 Mbps, 58 MHz, hsync 20/20/40, vsync 4/10/24, the panel&#39;s reset on GPIO 27 -</text><text x="76" y="838" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">active high, so the generated code pulses it itself, where the library&#39;s own pulse would leave this panel in reset - and the</text><text x="76" y="860" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">backlight on GPIO 26, lit when high and dimmed by PWM (Waveshare say a steady level does not light it, and the export&#39;s PWM never</text><text x="76" y="882" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">holds it steady). A design on this preset starts on revision 3 of the ESP32-P4, which Waveshare&#39;s own Arduino examples for the</text><text x="76" y="904" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">board build for; for a chip before revision 3 (the upload says &quot;revision v1.x&quot;), choose that under Hardware &gt; Board &gt; Chip</text><text x="76" y="926" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">revision. The GT911 has no reset or interrupt line driven and may answer at 0x14 instead of 0x5D. The TF card (SDMMC, 4-bit) and</text><text x="76" y="948" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the ES8311 speaker codec (amplifier on GPIO 53) are in the kit. Wi-Fi is the ESP32-C6 beside the P4, in the kit as the Wi-Fi</text><text x="76" y="970" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">co-processor on the ESP32 core&#39;s own SDIO lines (CLK 18, CMD 19, D0-D3 14-17, reset 54) - Waveshare publish no pins for it, and</text><text x="76" y="992" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">their own Arduino Wi-Fi example uses those defaults; it has to run ESP-Hosted of the core&#39;s release, which the board prints at</text><text x="76" y="1014" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">start (see the README). Wi-Fi through it compiles and has not been on a board. Not driven: the two ES7210 microphones, the camera</text><text x="76" y="1036" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">connector and the C6&#39;s Bluetooth; ESP-NOW does not go through the C6.</text><text x="56" y="1090" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-p4-wifi6-touch-lcd-5&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1114" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-p4-wifi6-touch-lcd-5</text></svg>