font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="626" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">LED (output)</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 5</text><rect x="56" y="552" width="1128" height="144" rx="10" fill="#fdf7e8"/><text x="76" y="576" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="600" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-1.43C). None between the</text><text x="76" y="622" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">vendor&#39;s code and the schematic: every pin in bsp_config.h is the net the schematic&#39;s GPIO table and panel connector give that</text><text x="76" y="644" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">GPIO. Waveshare runs this glass under orientation byte 0xC0 with the picture starting at column 8, and the preset does the same:</text><text x="76" y="666" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the byte is on the Display tab, and a turned design is turned over it. Brightness is a command to the panel, not a backlight pin.</text><text x="76" y="688" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Compiled; not run on a board here.</text><text x="56" y="742" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-amoled-143c&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="766" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-amoled-143c</text></svg>