<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1068" viewBox="0 0 1240 1068"><rect width="1240" height="1068" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-S3-Touch-AMOLED-2.06</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-S3   ·   CO5300 410 x 502   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - QSPI (quad SPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0 - D3</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4, 5, 6, 7</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 12</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="380" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - FT3168 / FT6146</text><rect x="56" y="394" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><text x="56" y="564" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 15 / 14)</text><rect x="56" y="578" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="580" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="56" y="688" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">PMIC - AXP2101</text><rect x="56" y="702" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="704" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="722" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="606" text-anchor="end" y="722" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="56" y="752" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="606" text-anchor="end" y="752" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x34</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="626" y="520" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 3</text><text x="634" y="598" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="612" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="614" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PWRButton (input)</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 10</text><rect x="56" y="800" width="1128" height="166" rx="10" fill="#fdf7e8"/><text x="76" y="824" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="848" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-2.06). Bus speed: 40 MHz in</text><text x="76" y="870" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the ESP-IDF BSP, 80 MHz (library default) in the Arduino examples; recorded 40. Start-up table and starting brightness differ by</text><text x="76" y="892" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">framework (BSP table ending 0x51 = 0xFF, Arduino class ending 0x51 = 0xD0); both are recorded, the BSP&#39;s as initSeq. The glass has</text><text x="76" y="914" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">rounded corners whose radius Waveshare does not give, so the designer draws them square: keep what matters out of the corners, or</text><text x="76" y="936" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">set a corner radius on the Display tab once it is measured. On the board and not in this preset: 16 MB of its 32 MB flash: the</text><text x="76" y="958" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">export builds for 16 MB. Brightness is a command to the panel, not a backlight pin. Compiled; not run on a board here.</text><text x="56" y="1012" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-amoled-206&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1036" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-amoled-206</text></svg>