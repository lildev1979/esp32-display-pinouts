<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1336" viewBox="0 0 1240 1336"><rect width="1240" height="1336" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-S3-Touch-LCD-7</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-S3   ·   Generic RGB565 panel 800 x 480   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - RGB565 parallel (DPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DE</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 5</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">VSYNC</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 3</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">HSYNC</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 46</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PCLK</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">R0 - R4</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1, 2, 42, 41, 40</text><text x="56" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">G0 - G5</text><text x="606" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39, 0, 45, 48, 47, 21</text><rect x="48" y="392" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="410" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">B0 - B4</text><text x="606" text-anchor="end" y="410" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14, 38, 18, 17, 10</text><text x="56" y="440" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="440" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">CH422G 3</text><text x="56" y="500" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="514" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><rect x="48" y="576" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="594" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="594" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4</text><text x="56" y="624" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="624" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">CH422G 1</text><text x="56" y="684" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="698" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="700" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="718" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="718" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">CH422G 2</text><text x="56" y="748" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="748" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="760" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="778" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="778" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">on / off</text><text x="56" y="838" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C0 (touch, CH422G, header)</text><rect x="56" y="852" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="854" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="872" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="872" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="902" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="902" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SPI (TF card)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 12</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 13</text><text x="634" y="350" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">CH422G (I/O expander)</text><rect x="634" y="364" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Type</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">CH422G</text><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x24</text><text x="634" y="474" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="488" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">SPI (TF card)</text><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">CH422G 4</text><text x="634" y="598" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RS485 - RS485 / Modbus RTU</text><rect x="634" y="612" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="614" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">TX</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RX</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="634" y="722" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">CanBus - CAN bus / OBD-II</text><rect x="634" y="736" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="738" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">TX</text><text x="1184" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 20</text><text x="634" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RX</text><text x="1184" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="798" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="816" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">EN</text><text x="1184" text-anchor="end" y="816" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">CH422G 5</text><text x="634" y="876" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="890" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="892" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="910" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Sensor AD (analog in)</text><text x="1184" text-anchor="end" y="910" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 6</text><rect x="56" y="958" width="1128" height="276" rx="10" fill="#fdf7e8"/><text x="76" y="982" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="1006" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Touch reset (EXIO1), backlight enable (EXIO2, DISP on the schematic), panel reset (EXIO3), the TF card&#39;s CS (EXIO4), the USB / CAN</text><text x="76" y="1028" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">switch (EXIO5) and the panel&#39;s supply enable (EXIO6, LCD_VDD_EN) sit on a CH422G expander on the I2C bus at GPIO 8/9; the generated</text><text x="76" y="1050" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">code brings the expander up first and drives them. ESPHome drives EXIO2 and EXIO6 together as enable pins, so if the panel is dark</text><text x="76" y="1072" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">with the backlight apparently on, look at those two for your revision. The TF card is on SPI (MOSI 11, SCK 12, MISO 13) and must be</text><text x="76" y="1094" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the only thing on it: its CS cannot be toggled through the expander, so the card is selected once and stays selected. RS485 is an</text><text x="76" y="1116" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">SP3485 that turns itself round - the chip sends on GPIO 16 and receives on GPIO 15, which is the other way about from Waveshare&#39;s</text><text x="76" y="1138" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">pin table (it names the two from the transceiver&#39;s side). GPIO 19 and 20 are the USB port until EXIO5 is raised, which hands them</text><text x="76" y="1160" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">to the CAN transceiver (TX 20, RX 19): the CAN bus arrives switched off, and switching it on takes the USB port away - the expander</text><text x="76" y="1182" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">keeps its lines through a reset, so flash through the UART port, or power the board off and on. The Sensor AD terminal is GPIO 6, 0</text><text x="76" y="1204" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">to about 3.1 V. The serial log is the UART port (GPIO 43/44). Read off the schematic; nobody here has had this board in their</text><text x="76" y="1226" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">hands.</text><text x="56" y="1280" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-7&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1304" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-7</text></svg>