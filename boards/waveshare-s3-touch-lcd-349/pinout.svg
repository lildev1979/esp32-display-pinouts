<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1198" viewBox="0 0 1240 1198"><rect width="1240" height="1198" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-S3-Touch-LCD-3.49</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-S3   ·   AXS15231B 172 x 640   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - QSPI (quad SPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 10</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0 - D3</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11, 12, 13, 14</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 5</text><text x="56" y="380" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - AXS15231B (touch half)</text><rect x="56" y="394" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 0</text><text x="56" y="534" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="548" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="550" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="568" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="568" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="56" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">low</text><rect x="48" y="610" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="56" y="688" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 47 / 48)</text><rect x="56" y="702" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="704" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="722" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="722" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 47</text><text x="56" y="752" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="752" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 48</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">TCA9554 (I/O expander)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Type</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x20</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 47 / 48)</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 47 / 48)</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><rect x="626" y="644" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="634" y="722" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="736" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="738" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="1184" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4</text><text x="634" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="626" y="798" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="816" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PWRSYSOUTButton (input)</text><text x="1184" text-anchor="end" y="816" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><rect x="56" y="864" width="1128" height="232" rx="10" fill="#fdf7e8"/><text x="76" y="888" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="912" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.49-V2). Two hardware revisions</text><text x="76" y="934" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">with different pins; recorded V2 (Rev1.1 silkscreen), which is all that ships since 2026-06-08. The touch panel has I2C pins 17/18</text><text x="76" y="956" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">to itself; the I/O expander, both audio chips, the IMU and the clock are on 47/48. The backlight needs EXIO1 on the expander held</text><text x="76" y="978" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">high as well as its PWM pin (active low), and the panel is reset through EXIO5. The ES7210 is at its default address 0x40, not</text><text x="76" y="1000" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">re-read from its straps, with its data on GPIO 6. Battery sense is GPIO4 through a divide-by-three; the scale is not calibrated.</text><text x="76" y="1022" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">The PWR key&#39;s active level is not verified. The touch panel reports along the long side of the glass: x is its Y, and y is 640 less</text><text x="76" y="1044" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">its X (Waveshare&#39;s lvgl_port.c), which is Swap X/Y with Invert Y here - seen wrong on the owner&#39;s board on 2026-10-10 before this</text><text x="76" y="1066" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">was set. Run on a V2 board on 2026-10-10: the panel, the touch, the backlight and the parts above were reported working with this</text><text x="76" y="1088" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">preset.</text><text x="56" y="1142" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-lcd-349&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1166" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-lcd-349</text></svg>