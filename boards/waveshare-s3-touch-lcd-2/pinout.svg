tserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><rect x="626" y="696" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="714" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D7</text><text x="1184" text-anchor="end" y="714" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="634" y="744" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PWDN</text><text x="1184" text-anchor="end" y="744" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><text x="634" y="804" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="818" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="820" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="838" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="838" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="56" y="984" width="1128" height="144" rx="10" fill="#fdf7e8"/><text x="76" y="1008" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="1032" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic</text><text x="76" y="1054" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(https://files.waveshare.com/wiki/ESP32-S3-Touch-LCD-2/ESP32-S3-Touch-LCD-2-Demo.zip). Wiki spec table says &#39;USB Type-A&#39; and &#39;LCD</text><text x="76" y="1076" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">type ISP&#39; - copy errors; the features list and schematic show USB Type-C wired to the S3&#39;s native USB. Camera connector (in the</text><text x="76" y="1098" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">kit, switched off): pins are Waveshare&#39;s 09_lvgl_camera.ino (the 2&quot; boards&#39; demo zip), its control lines on a bus of their own</text><text x="76" y="1120" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(GPIO 21 / 16), 20 MHz, RGB565, power-down GPIO 17. Nothing has run on a board.</text><text x="56" y="1174" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-lcd-2&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1198" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-lcd-2</text></svg>