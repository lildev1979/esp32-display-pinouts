<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="818" viewBox="0 0 1240 818"><rect width="1240" height="818" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Elecrow CrowPanel Advanced ESP32-P4 7 / 9 / 10.1 inch</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-P4   ·   EK79007 1024 x 600   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - MIPI-DSI</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="56" y="290" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="304" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="306" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="324" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="324" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 45</text><text x="56" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 46</text><rect x="48" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 31</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 30000 Hz</text><text x="634" y="350" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C1 (touch, I2C port)</text><rect x="634" y="364" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 45</text><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 46</text><rect x="56" y="462" width="1128" height="254" rx="10" fill="#fdf7e8"/><text x="76" y="486" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="510" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel. The 7&quot;, 9&quot; and 10.1&quot; share</text><text x="76" y="532" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">every pin and the same 1024x600 EK79007 panel; pins and settings are from Elecrow&#39;s own Arduino lessons for each size (51 MHz, 1000</text><text x="76" y="554" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Mbps a lane, hsync 70/160/160, vsync 10/23/21), the same on hardware V1.0 and V1.2. If the screen stays dark with the backlight</text><text x="76" y="576" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">lit, try 52 MHz with hsync 10/160/160 and vsync 1/23/12, which is what GFX Library for Arduino&#39;s own definition of the 7&quot; runs. The</text><text x="76" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">touch controller may answer at 0x14 instead of 0x5D. Touch, the panel&#39;s reset and the TF card are on GPIO 39-48, which the P4</text><text x="76" y="620" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">powers from its LDO channel 4: Arduino ESP32 core 3.3.11 and 3.3.12 switch that on by themselves when the pins are first used; core</text><text x="76" y="642" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">3.2.0 does not, and there the touch will not answer. The speaker is an I2S amplifier (BCLK 22, LRCK 21, data 23) switched on by</text><text x="76" y="664" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">pulling GPIO 30 low. Not driven: the TF card (SDMMC CLK 43, CMD 44, D0 39), the PDM microphone (CLK 24, data 26), the camera, and</text><text x="76" y="686" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the ESP32-C6 radio, so there is no Wi-Fi or Bluetooth. The export builds for an ESP32-P4 before revision 3, which is what Elecrow&#39;s</text><text x="76" y="708" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">own ESP-IDF lessons build for.</text><text x="56" y="762" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;elecrow-crowpanel-advanced-p4&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/elecrow-crowpanel-advanced-p4</text></svg>