y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="56" y="474" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="488" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 31</text><text x="56" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="550" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="568" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="568" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 30000 Hz</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C1 (touch, I2C port)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 45</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 46</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">WiFiCoprocessor - Wi-Fi co-processor</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><text x="634" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><rect x="626" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="634" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><rect x="626" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RST</text><text x="1184" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 54</text><rect x="56" y="616" width="1128" height="342" rx="10" fill="#fdf7e8"/><text x="76" y="640" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="664" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel. The 7&quot;, 9&quot; and 10.1&quot; share</text><text x="76" y="686" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">every pin and the same 1024x600 EK79007 panel; pins and settings are from Elecrow&#39;s own Arduino lessons for each size (51 MHz, 1000</text><text x="76" y="708" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Mbps a lane, hsync 70/160/160, vsync 10/23/21), the same on hardware V1.0 and V1.2. If the screen stays dark with the backlight</text><text x="76" y="730" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">lit, try 52 MHz with hsync 10/160/160 and vsync 1/23/12, which is what GFX Library for Arduino&#39;s own definition of the 7&quot; runs. The</text><text x="76" y="752" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">touch controller may answer at 0x14 instead of 0x5D. Touch, the panel&#39;s reset and the TF card are on GPIO 39-48, which the P4</text><text x="76" y="774" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">powers from its LDO channel 4: Arduino ESP32 core 3.3.11 and 3.3.12 switch that on by themselves when the pins are first used; core</text><text x="76" y="796" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">3.2.0 does not, and there the touch will not answer. The speaker is an I2S amplifier (BCLK 22, LRCK 21, data 23) switched on by</text><text x="76" y="818" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">pulling GPIO 30 low. Wi-Fi is the ESP32-C6, in the kit as the Wi-Fi co-processor on hardware V1.2&#39;s SDIO lines (CLK 18, CMD 19,</text><text x="76" y="840" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">D0-D3 17/16/15/14, reset 54, from Elecrow&#39;s own Arduino lesson): a V1.1 board resets it on GPIO 32 instead, and a V1.0 board, whose</text><text x="76" y="862" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">link has one data line, gets no Wi-Fi here. The C6 has to run ESP-Hosted of the core&#39;s release, which the board prints at start</text><text x="76" y="884" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(see the README). Wi-Fi through it compiles and has not been on a board. Not driven: the TF card (SDMMC CLK 43, CMD 44, D0 39), the</text><text x="76" y="906" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">PDM microphone (CLK 24, data 26), the camera and the C6&#39;s Bluetooth; ESP-NOW does not go through the C6. A design on this preset</text><text x="76" y="928" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">builds for an ESP32-P4 before revision 3, which is what Elecrow&#39;s own ESP-IDF lessons build for; if the upload reports revision 3</text><text x="76" y="950" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(&quot;revision v3.1&quot;), choose that under Hardware &gt; Board &gt; Chip revision.</text><text x="56" y="1004" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;elecrow-crowpanel-advanced-p4&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1028" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/elecrow-crowpanel-advanced-p4</text></svg>