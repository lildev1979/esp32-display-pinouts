dth="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DC / RS</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="56" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">-</text><text x="56" y="440" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - XPT2046</text><rect x="56" y="454" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 25</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 32</text><rect x="48" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO</text><text x="606" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="56" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 33</text><rect x="48" y="576" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="594" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">IRQ / PENIRQ</text><text x="606" text-anchor="end" y="594" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 36</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="350" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">CN1 I2C (GPIO 27 / 22)</text><rect x="634" y="364" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><rect x="56" y="642" width="1128" height="100" rx="10" fill="#fdf7e8"/><text x="76" y="666" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="690" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Touch runs on its own VSPI bus, separate from the display HSPI bus. The 2432S028 also ships in a capacitive CST820 variant. Colour</text><text x="76" y="712" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">order is RGB with inversion off, confirmed on hardware - if a clone shows a negative image or swaps red and blue, change them on</text><text x="76" y="734" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the Display tab.</text><text x="56" y="788" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;cyd-2432s028r&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="812" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/cyd-2432s028r</text></svg>