<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1112" viewBox="0 0 1240 1112"><rect width="1240" height="1112" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-S3-Touch-AMOLED-2.16</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-S3   ·   CO5300 480 x 480   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - QSPI (quad SPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0 - D3</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4, 5, 6, 7</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 12</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="56" y="380" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - CST9217 / CST9220</text><rect x="56" y="394" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="56" y="564" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 15 / 14)</text><rect x="56" y="578" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="580" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="56" y="688" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="56" y="702" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="704" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="722" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="606" text-anchor="end" y="722" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="56" y="752" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="606" text-anchor="end" y="752" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">PMIC - AXP2101</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x34</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="626" y="520" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 3</text><text x="634" y="598" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="612" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="614" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">KEYButton (input)</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><rect x="626" y="674" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="692" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PWRButton (input)</text><text x="1184" text-anchor="end" y="692" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><rect x="56" y="800" width="1128" height="210" rx="10" fill="#fdf7e8"/><text x="76" y="824" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="848" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-2.16). 1) Start-up table: the</text><text x="76" y="870" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Arduino sketches use the GFX library&#39;s short CO5300 table and the ESP-IDF BSP a longer one with maker&#39;s-page writes (0xFE 0x20,</text><text x="76" y="892" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">0x19 0x10, 0x1C 0xA0), TE on and the two address windows. Both are Waveshare&#39;s for this board; the BSP&#39;s is recorded as `initSeq`</text><text x="76" y="914" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">because it is the fuller and is the one the C6 board of the same size shares. Waveshare runs this glass under orientation byte 0xA0</text><text x="76" y="936" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">with the picture starting at column 0, and the preset does the same: the byte is on the Display tab, and a turned design is turned</text><text x="76" y="958" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">over it. The glass has rounded corners whose radius Waveshare does not give, so the designer draws them square: keep what matters</text><text x="76" y="980" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">out of the corners, or set a corner radius on the Display tab once it is measured. Brightness is a command to the panel, not a</text><text x="76" y="1002" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">backlight pin. Compiled; not run on a board here.</text><text x="56" y="1056" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-amoled-216&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1080" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-amoled-216</text></svg>