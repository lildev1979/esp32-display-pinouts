<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1256" viewBox="0 0 1240 1256"><rect width="1240" height="1256" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-P4-NANO + 10.1-DSI-TOUCH-A</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-P4   ·   JD9365 800 x 1280   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - MIPI-DSI</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">-</text><text x="56" y="290" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="304" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="306" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="324" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="324" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="414" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight - on I2C</text><rect x="56" y="428" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="430" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="448" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="606" text-anchor="end" y="448" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x45</text><text x="56" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Register</text><text x="606" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x96, 0 - 255</text><rect x="48" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="606" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">touch panel&#39;s</text><text x="56" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 7 / 8)</text><rect x="56" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="692" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Ethernet - Ethernet PHY on RMII</text><rect x="56" y="706" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="708" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="726" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MDC</text><text x="606" text-anchor="end" y="726" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 31</text><text x="56" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MDIO</text><text x="606" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 52</text><rect x="48" y="768" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">POWER</text><text x="606" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 51</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 43</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 44</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="634" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><rect x="626" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="634" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="634" y="440" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">WiFiCoprocessor - Wi-Fi co-processor</text><rect x="634" y="454" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="634" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="626" y="576" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="594" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="594" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="624" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="624" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="636" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="654" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RST</text><text x="1184" text-anchor="end" y="654" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 54</text><rect x="56" y="834" width="1128" height="320" rx="10" fill="#fdf7e8"/><text x="76" y="858" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="882" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this screen: the export compiles and has not been seen on the panel. The NANO gives the screen two</text><text x="76" y="904" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">MIPI-DSI lanes and I2C on GPIO 7/8: its supplies, its reset and its backlight are a chip on the screen at 0x45, which the generated</text><text x="76" y="926" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">code sets up before the panel as Waveshare&#39;s Arduino code does (0x95 and 0x96, 100 ms apart). The backlight is that chip&#39;s register</text><text x="76" y="948" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">0x96, 0 to 255, and the serial monitor says if the chip did not answer. The panel settings are Waveshare&#39;s (JD9365, two lanes at</text><text x="76" y="970" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">1500 Mbps, 80 MHz, hsync 20/20/40, vsync 4/10/30): if the light comes on and no picture does, try 60 MHz, a VSYNC back porch of 12</text><text x="76" y="992" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">and 750 Mbps. The GT911 may answer at 0x14. In the kit: the TF card, the ES8311 codec and its microphone (amplifier GPIO 53), and</text><text x="76" y="1014" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Ethernet (an IP101, arriving switched off). A design on this screen starts on revision 3 of the ESP32-P4, which newer NANOs carry</text><text x="76" y="1036" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">and Waveshare&#39;s own Arduino examples for the NANO build for (ChipVariant=postv3); an older NANO may have a chip before revision 3</text><text x="76" y="1058" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(the upload says &quot;revision v1.x&quot;): choose that under Hardware &gt; Board &gt; Chip revision. Wi-Fi is the ESP32-C6, in the kit as the</text><text x="76" y="1080" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Wi-Fi co-processor on the ESP32 core&#39;s own SDIO lines (CLK 18, CMD 19, D0-D3 14-17, its CHIP_PU on GPIO 54, as Waveshare&#39;s</text><text x="76" y="1102" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">schematic for the NANO wires them); it has to run ESP-Hosted of the core&#39;s release, which the board prints at start (see the</text><text x="76" y="1124" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">README). Wi-Fi through it compiles and has not been on a board. Not driven: the camera and the C6&#39;s Bluetooth; ESP-NOW does not go</text><text x="76" y="1146" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">through the C6.</text><text x="56" y="1200" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-p4-nano-101-dsi-touch-a&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1224" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-p4-nano-101-dsi-touch-a</text></svg>