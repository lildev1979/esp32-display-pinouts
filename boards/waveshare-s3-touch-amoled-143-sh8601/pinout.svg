y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">SPI (TF card)</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><text x="634" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="1184" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4</text><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="56" y="770" width="1128" height="166" rx="10" fill="#fdf7e8"/><text x="76" y="794" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="818" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic</text><text x="76" y="840" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(https://files.waveshare.com/wiki/ESP32-S3-Touch-AMOLED-1.43/ESP32-S3-AMOLED-1.43-Demo-V3.zip). Sold with one of two panels under</text><text x="76" y="862" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the same part number. This is the SH8601 one (its id register 0xDA reads 0x86); if the picture sits 6 columns to the left, choose</text><text x="76" y="884" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the CO5300 preset. Every pin recorded agrees between the vendor&#39;s code and the schematic&#39;s GPIO table (QSPI 9/10/11-14, RST 21,</text><text x="76" y="906" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">OLED_EN 42, I2C 47/48, SD 38-41, BAT_ADC 4, BOOT 0). Brightness is a command to the panel, not a backlight pin. Compiled; not run</text><text x="76" y="928" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">on a board here.</text><text x="56" y="982" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-amoled-143-sh8601&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1006" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-amoled-143-sh8601</text></svg>