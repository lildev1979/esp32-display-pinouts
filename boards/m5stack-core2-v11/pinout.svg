<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="956" viewBox="0 0 1240 956"><rect width="1240" height="956" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">M5Stack Core2 v1.1 (AXP2101)</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32   ·   ILI9342 / ILI9342C 320 x 240   ·   LovyanGFX   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - SPI (4-wire serial)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK / CLK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI / SDA</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 23</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO / SDO</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 5</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DC / RS</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">Power ALDO2</text><text x="56" y="440" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - FT6236 / FT6336U</text><rect x="56" y="454" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><rect x="48" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">-</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">on / off</text><text x="634" y="350" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Internal I2C (GPIO 21 / 22)</text><rect x="634" y="364" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><text x="634" y="474" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Port A (Grove, GPIO 32 / 33)</text><rect x="634" y="488" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 32</text><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 33</text><text x="634" y="598" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Power - AXP2101</text><rect x="634" y="612" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="614" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">Internal I2C (GPIO 21 / 22)</text><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x34</text><rect x="56" y="710" width="1128" height="144" rx="10" fill="#fdf7e8"/><text x="76" y="734" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="758" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">This is the Core2 v1.1, with an AXP2101 power chip; the first Core2 (v1.0) has an AXP192 - choose the other preset for that one</text><text x="76" y="780" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(the chip&#39;s id says which: 0x4A at register 0x03 is an AXP2101, 0x03 an AXP192). The panel&#39;s supply, reset and backlight are driven</text><text x="76" y="802" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">through the AXP2101 as LovyanGFX&#39;s Core2 start-up drives them; the backlight is on at 3.0 V and does not dim. MicroPython starts</text><text x="76" y="824" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the chip before the panel too, on the touch panel I2C bus; ESPHome has no component for it and is not offered. Compiled; not seen</text><text x="76" y="846" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">on a panel by LCD Wizard.</text><text x="56" y="900" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;m5stack-core2-v11&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="924" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/m5stack-core2-v11</text></svg>