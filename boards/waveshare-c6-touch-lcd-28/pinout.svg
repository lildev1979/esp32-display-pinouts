<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1438" viewBox="0 0 1240 1438"><rect width="1240" height="1438" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-C6-Touch-LCD-2.8</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-C6   ·   ST7789 240 x 320   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - SPI (4-wire serial)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK / CLK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI / SDA</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DC / RS</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 10</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">IOExtension 1</text><text x="56" y="410" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - CST3530</text><rect x="56" y="424" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="426" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 6</text><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><rect x="48" y="486" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="56" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">IOExtension 0</text><text x="56" y="594" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="608" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="610" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">IOExtension 8</text><text x="56" y="658" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="658" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="670" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="688" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="688" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="56" y="748" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 6 / 7)</text><rect x="56" y="762" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="764" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="782" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="782" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 6</text><text x="56" y="812" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="812" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SPI (panel and TF card)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="634" y="350" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IOExtension (I/O expander)</text><rect x="634" y="364" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Type</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">WS_IOEXT</text><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x24</text><text x="634" y="474" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="488" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 6 / 7)</text><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="598" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="612" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="614" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 6 / 7)</text><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="722" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="736" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="738" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">SPI (panel and TF card)</text><text x="634" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="1184" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 23</text><text x="634" y="846" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="860" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="862" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="880" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="880" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><rect x="56" y="928" width="1128" height="408" rx="10" fill="#fdf7e8"/><text x="76" y="952" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="976" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board. The Arduino export for it compiles, and nothing in this preset has been seen on the panel</text><text x="76" y="998" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">or heard. Pins are from Waveshare&#39;s ESP-IDF BSP and pin table (https://github.com/waveshareteam/ESP32-C6-Touch-LCD-2.8, commit</text><text x="76" y="1020" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">c2a1cf84d6213597d47720a51b3e60cc7f1d5257). The panel is an ST7789 on SPI (SCK 0, MOSI 1, CS 11, DC 10). Its reset is EXIO1 of</text><text x="76" y="1042" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Waveshare&#39;s IO extension (a CH32V003 at 0x24), and the backlight is that chip&#39;s PWM channel. Touch (CST3530 at 0x58, INT GPIO 18,</text><text x="76" y="1064" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">reset EXIO0), the IO extension, the IMU (QMI8658, 0x6B), the RTC (PCF85063, 0x51) and the ES8311 codec (0x18) share I2C on SDA 6 /</text><text x="76" y="1086" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">SCL 7. Sound is the ES8311 on I2S: SCLK 15, LRCK 3, data to the codec on GPIO 2, data from it on GPIO 20. The board has no MCLK</text><text x="76" y="1108" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">line, so the export clocks the codec from SCLK, as Waveshare&#39;s BSP does (use_mclk = false). The NS4150B amplifier is switched on by</text><text x="76" y="1130" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">EXIO3, high. The microphone is taken to be on the codec&#39;s analog input, as on Waveshare&#39;s other ES8311 boards; Waveshare&#39;s BSP sets</text><text x="76" y="1152" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the codec up for playing only, so that is the least certain part. Speaker and microphone arrive switched off: switch them on under</text><text x="76" y="1174" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Hardware &gt; Audio. The TF card slot shares the panel&#39;s SPI lines (SCK 0, MOSI 1; MISO 8 and CS 23 are its own), as Waveshare&#39;s</text><text x="76" y="1196" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">ESP-IDF BSP runs it beside the panel; CS 23 is held high from boot. It arrives switched off; switched on under Hardware &gt; Devices,</text><text x="76" y="1218" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">it is started on the panel&#39;s bus once the panel has - compiled, not yet read on a board. On the board and not in this preset: the</text><text x="76" y="1240" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">SHTC3 temperature and humidity sensor (0x70), which the app has no driver for; the battery voltage, read through the IO extension&#39;s</text><text x="76" y="1262" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">ADC, which the export does not read as an analog input; and the IMU&#39;s and RTC&#39;s interrupts (GPIO 19, EXIO2). Flash: the docs and</text><text x="76" y="1284" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Waveshare&#39;s sdkconfigs say 16 MB, and the schematic&#39;s module symbol reads ESP32-C6-WROOM-1-N8 (8 MB). 16 is recorded; check with</text><text x="76" y="1306" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">esptool flash_id. The ES8311 is set to +15 dB (Speaker gain on Hardware &gt; Audio): its amplifier has a fixed gain and the speaker</text><text x="76" y="1328" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">was very quiet at 0 dB, quieter than the AMOLED 2.16&#39;s. The default was set by ear on this board on 2026-10-20.</text><text x="56" y="1382" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-c6-touch-lcd-28&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1406" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-c6-touch-lcd-28</text></svg>