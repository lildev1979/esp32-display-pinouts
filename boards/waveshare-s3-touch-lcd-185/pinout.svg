x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="350" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 11 / 10)</text><rect x="634" y="364" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="366" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11</text><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 10</text><text x="634" y="474" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">TCA9554 (I/O expander)</text><rect x="634" y="488" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Type</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554</text><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x20</text><rect x="56" y="586" width="1128" height="122" rx="10" fill="#fdf7e8"/><text x="76" y="610" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="634" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic</text><text x="76" y="656" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(https://files.waveshare.com/wiki/ESP32-S3-Touch-LCD-1.85/ESP32-S3-Touch-LCD-1.85-Demo.zip). SD D3/CS: the schematic&#39;s pin table</text><text x="76" y="678" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">and the wiki put it on Extend_IO3 (TCA9554 P2), but the Arduino demo&#39;s SD_Card.cpp toggles EXIO_PIN4 (P3, which the schematic gives</text><text x="76" y="700" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">to IMU_INT2).</text><text x="56" y="754" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-lcd-185&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="778" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-lcd-185</text></svg>