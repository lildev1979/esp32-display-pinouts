<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1192" viewBox="0 0 1240 1192"><rect width="1240" height="1192" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">LCDWIKI 4.0&quot; ESP32-S3 (ES3C40P)</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-S3   ·   ST7796 / ST7796S 320 x 480   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - SPI (4-wire serial)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK / CLK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 12</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI / SDA</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MISO / SDO</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 13</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 10</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DC / RS</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 46</text><text x="56" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">-</text><text x="56" y="440" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - FT6236 / FT6336U</text><rect x="56" y="454" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="48" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><text x="56" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="56" y="624" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="638" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="640" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="658" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="658" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 45</text><text x="56" y="688" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="688" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="700" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="718" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="718" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 16 / 15, IIC header)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><rect x="626" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="634" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><rect x="626" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 48</text><text x="634" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 47</text><text x="634" y="564" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RgbLed - NeoPixel string</text><rect x="634" y="578" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="580" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DATA</text><text x="1184" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="634" y="658" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="672" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="674" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="692" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="1184" text-anchor="end" y="692" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><text x="634" y="722" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Boot Button (input)</text><text x="1184" text-anchor="end" y="722" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="56" y="770" width="1128" height="320" rx="10" fill="#fdf7e8"/><text x="76" y="794" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="818" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Run on a board (2026-10-22): the picture, touch (FT6336U at 0x38), the ES8311 answering at 0x18 and the 4-bit SD card (it mounted</text><text x="76" y="840" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">and read a 128 GB card) were seen working. Not reported yet: sound from the speaker, the microphone, the RGB LED and the battery</text><text x="76" y="862" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">reading. Pins are from LCDWIKI&#39;s page, Arduino demo instructions and schematic (their demo source is not published). The panel is</text><text x="76" y="884" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">set as LCDWIKI&#39;s ST7796_Init.txt has it - inversion on, BGR - with its power, VCOM and gamma sent as Panel tuning (the first build</text><text x="76" y="906" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">without them looked a little washed out); if colours come out negative turn Invert off, if red and blue are swapped change the</text><text x="76" y="928" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">colour order. The SPI clock is 80 MHz, sent to GFX Library for Arduino (which otherwise starts at 40 MHz); if the picture is noisy</text><text x="76" y="950" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">or garbled, set the SPI clock back to 40 MHz. Its reset is the board&#39;s RESET button, not a GPIO; DC (46) and the backlight (45) are</text><text x="76" y="972" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">strapping pins used as outputs once running. Touch, the ES8311 and the IIC header share I2C on GPIO 16/15. The speaker amplifier is</text><text x="76" y="994" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">enabled by pulling GPIO1 low; sound goes out on GPIO8 and the microphone comes in on GPIO6 (the page&#39;s I2S_DO/I2S_DI names are the</text><text x="76" y="1016" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">other way round to the schematic) - switch it on under Hardware &gt; Audio. Battery: two 100K resistors halve the cell on GPIO9. For</text><text x="76" y="1038" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">smoother screen changes raise the draw buffer in Project settings (120 lines, double buffered, in PSRAM). Left free on the</text><text x="76" y="1060" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">expansion header: GPIO 2, 3, 14 and 21, and UART0 on 43/44. USB-C goes straight to the S3, so the serial log needs USB CDC On Boot</text><text x="76" y="1082" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(the export sets it).</text><text x="56" y="1136" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;lcdwiki-es3c40p&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1160" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/lcdwiki-es3c40p</text></svg>