<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1346" viewBox="0 0 1240 1346"><rect width="1240" height="1346" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-P4-WIFI6-Touch-LCD-7B</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-P4   ·   EK79007 1024 x 600   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - MIPI-DSI</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 33</text><text x="56" y="290" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="304" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="306" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="324" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="324" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="414" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="428" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="430" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="448" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="448" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 32</text><text x="56" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">low</text><rect x="48" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="56" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 7 / 8)</text><rect x="56" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="692" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="56" y="706" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="708" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="726" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="606" text-anchor="end" y="726" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 43</text><text x="56" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="606" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 44</text><rect x="48" y="768" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="606" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="56" y="816" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="606" text-anchor="end" y="816" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><rect x="48" y="828" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="846" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="606" text-anchor="end" y="846" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="56" y="876" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="606" text-anchor="end" y="876" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RS485 - RS485 / Modbus RTU</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">TX</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RX</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 26</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">CanBus - CAN bus / OBD-II</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">TX</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RX</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">WiFiCoprocessor - Wi-Fi co-processor</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="520" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="634" y="568" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="568" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="626" y="580" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="640" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="658" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RST</text><text x="1184" text-anchor="end" y="658" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 54</text><rect x="56" y="924" width="1128" height="320" rx="10" fill="#fdf7e8"/><text x="76" y="948" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="972" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel. Pins, the panel&#39;s start-up</text><text x="76" y="994" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">table and its settings are Waveshare&#39;s own, from their Arduino examples for this board (EK79007 on two lanes at 1000 Mbps, 52 MHz,</text><text x="76" y="1016" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">hsync 10/160/160, vsync 1/23/12, LCD reset GPIO 33) and their ESP-IDF BSP. The backlight is GPIO 32 and is lit when the pin is LOW;</text><text x="76" y="1038" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the export dims it with the PWM inverted. The GT911 has no reset or interrupt line and may answer at 0x14 instead of 0x5D; its</text><text x="76" y="1060" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">readings are mirrored on both axes, which the preset undoes. Boards sold now usually carry an ESP32-P4 of revision 3 (Waveshare&#39;s</text><text x="76" y="1082" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">own Arduino examples build for it), and a design on this preset starts on it; for a chip before revision 3 (the upload says</text><text x="76" y="1104" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">&quot;revision v1.x&quot;), choose that under Hardware &gt; Board &gt; Chip revision. The TF card (SDMMC, 4-bit), the ES8311 speaker codec</text><text x="76" y="1126" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(amplifier on GPIO 53), RS485 (TX 27, RX 26, no direction pin) and CAN (TX 22, RX 21, arriving switched off) are in the kit. Wi-Fi</text><text x="76" y="1148" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">is the ESP32-C6 beside the P4, in the kit as the Wi-Fi co-processor on the ESP32 core&#39;s own SDIO lines (CLK 18, CMD 19, D0-D3</text><text x="76" y="1170" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">14-17, reset 54) - Waveshare publish no pins for it, and their own Arduino Wi-Fi example uses those defaults; it has to run</text><text x="76" y="1192" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">ESP-Hosted of the core&#39;s release, which the board prints at start (see the README; Waveshare&#39;s FAQ flashes the C6 over its own</text><text x="76" y="1214" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">UART). Wi-Fi through it compiles and has not been on a board. Not driven: the two ES7210 microphones, the camera connector and the</text><text x="76" y="1236" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">C6&#39;s Bluetooth; ESP-NOW does not go through the C6.</text><text x="56" y="1290" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-p4-wifi6-touch-lcd-7b&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1314" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-p4-wifi6-touch-lcd-7b</text></svg>