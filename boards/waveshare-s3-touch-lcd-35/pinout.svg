4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 8 / 7)</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">XCLK</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><rect x="626" y="520" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PCLK</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="634" y="568" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">VSYNC</text><text x="1184" text-anchor="end" y="568" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="580" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">HREF</text><text x="1184" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 45</text><rect x="626" y="640" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="658" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="658" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 47</text><text x="634" y="688" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="688" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 48</text><rect x="626" y="700" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="718" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="718" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 46</text><text x="634" y="748" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D4</text><text x="1184" text-anchor="end" y="748" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><rect x="626" y="760" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="778" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D5</text><text x="1184" text-anchor="end" y="778" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="634" y="808" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D6</text><text x="1184" text-anchor="end" y="808" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><rect x="626" y="820" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="838" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D7</text><text x="1184" text-anchor="end" y="838" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="634" y="898" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="912" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="914" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="932" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="932" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="56" y="1078" width="1128" height="166" rx="10" fill="#fdf7e8"/><text x="76" y="1102" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="1126" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.5 (commit</text><text x="76" y="1148" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">283ec84c566c096f8c30493b93dcd4b0bb608de7)). SPI clock: vendor IDF 80 MHz, xiaozhi 40 MHz. Camera connector (in the kit, switched</text><text x="76" y="1170" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">off): pins are Waveshare&#39;s esp_camera_port.cpp for this board (the same twelve as the 3.5B&#39;s), control on the I2C bus on 8 / 7, 20</text><text x="76" y="1192" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">MHz, RGB565, PWDN and RESET unused there; the AXP2101&#39;s BLDO1 1.5 V and BLDO2 2.8 V are set as that repo&#39;s esp_axp2101_port.cpp</text><text x="76" y="1214" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">sets them (the 3.5B schematic has them feeding the camera). Nothing has run on a board; xiaozhi drives EXIO0 low and that may be</text><text x="76" y="1236" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the camera&#39;s power-down - not confirmed.</text><text x="56" y="1290" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-lcd-35&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1314" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-lcd-35</text></svg>