="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 10</text><rect x="626" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><text x="634" y="474" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Camera</text><rect x="634" y="488" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 8 / 7, header pins 27 / 25)</text><text x="634" y="538" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">XCLK</text><text x="1184" text-anchor="end" y="538" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><rect x="626" y="550" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="568" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PCLK</text><text x="1184" text-anchor="end" y="568" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="634" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">VSYNC</text><text x="1184" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="610" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">HREF</text><text x="1184" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="658" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="658" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 45</text><rect x="626" y="670" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="688" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="688" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 47</text><text x="634" y="718" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="718" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 48</text><rect x="626" y="730" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="748" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="748" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 46</text><text x="634" y="778" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D4</text><text x="1184" text-anchor="end" y="778" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><rect x="626" y="790" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="808" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D5</text><text x="1184" text-anchor="end" y="808" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="634" y="838" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D6</text><text x="1184" text-anchor="end" y="838" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><rect x="626" y="850" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="868" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D7</text><text x="1184" text-anchor="end" y="868" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="634" y="898" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PWDN</text><text x="1184" text-anchor="end" y="898" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 0</text><text x="634" y="958" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="972" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="974" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="992" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Boot Button (input)</text><text x="1184" text-anchor="end" y="992" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="56" y="1142" width="1128" height="188" rx="10" fill="#fdf7e8"/><text x="76" y="1166" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="1190" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Panel reset (EXIO1), the speaker amplifier (EXIO7) and the TF card&#39;s DAT3 (EXIO3) are on the TCA9554 at 0x20; touch, the ES8311,</text><text x="76" y="1212" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the AXP2101, the QMI8658 and the PCF85063 share the I2C bus on GPIO 8/7. The panel ignores the row address over QSPI, so the export</text><text x="76" y="1234" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">draws whole frames from a canvas in PSRAM. MCLK is GPIO44, which is also the header&#39;s RXD - leave it alone while audio is on. USB-C</text><text x="76" y="1256" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">goes straight to the S3, so the serial log needs USB CDC On Boot (the export sets it). The microphone goes into the ES8311 and</text><text x="76" y="1278" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">comes back on GPIO 14 - switch it on under Hardware &gt; Audio. The camera connector is in the kit, switched off: only the &quot;-C&quot;</text><text x="76" y="1300" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">version of the board has a camera fitted. Its clock, sync and data lines are GPIO 38, 41, 17, 18 and 45, 47, 48, 46, 42, 40, 39, 21</text><text x="76" y="1322" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">- header pins on a board with no camera - its control lines are the I2C bus, and its power-down is EXIO0.</text><text x="56" y="1376" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-35b&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1400" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-35b</text></svg>