-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - CST9217 / CST9220</text><rect x="56" y="394" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="56" y="564" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 15 / 14)</text><rect x="56" y="578" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="580" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="56" y="688" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">TCA9554 (I/O expander)</text><rect x="56" y="702" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="704" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="722" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Type</text><text x="606" text-anchor="end" y="722" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554</text><text x="56" y="752" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="606" text-anchor="end" y="752" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x20</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">PMIC - AXP2101</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x34</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 14)</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="626" y="644" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 3</text><text x="634" y="722" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="736" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="738" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="634" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PWRButton (input)</text><text x="1184" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 4</text><rect x="56" y="834" width="1128" height="166" rx="10" fill="#fdf7e8"/><text x="76" y="858" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="882" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-1.75). 1) pin_config.h</text><text x="76" y="904" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">carries two sets of audio macros. The &#39;// ES8311&#39; block says I2S_MCK_IO 16 - wrong: GPIO16 is header pin, MCLK is GPIO42 in the</text><text x="76" y="926" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">schematic, in the BSP and in the second block (MCLKPIN 42) that 08_ES8311.ino really uses. The names DOPIN 10 / DIPIN 8 are from</text><text x="76" y="948" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the codec&#39;s side: the sketch passes DIPIN as the ESP&#39;s data out. Believed the schematic and the BSP: ESP out 8, ESP in 10, MCLK 42.</text><text x="76" y="970" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">On the board and not in this preset: LC76G: no driver. Brightness is a command to the panel, not a backlight pin. Compiled; not run</text><text x="76" y="992" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">on a board here.</text><text x="56" y="1046" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-amoled-175&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1070" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-amoled-175</text></svg>