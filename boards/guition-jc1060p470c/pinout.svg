rat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="692" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="752" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Ethernet - Ethernet PHY on RMII</text><rect x="56" y="766" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="768" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MDC</text><text x="606" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 31</text><text x="56" y="816" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MDIO</text><text x="606" text-anchor="end" y="816" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 52</text><rect x="48" y="828" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="846" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">POWER</text><text x="606" text-anchor="end" y="846" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 51</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">WiFiCoprocessor - Wi-Fi co-processor</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="634" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="626" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="392" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="410" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RST</text><text x="1184" text-anchor="end" y="410" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 54</text><text x="634" y="470" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="484" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="486" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 43</text><text x="634" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 44</text><rect x="626" y="546" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="634" y="594" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="594" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><rect x="626" y="606" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="624" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="624" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="634" y="654" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="654" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="634" y="714" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RS485 - RS485 / Modbus RTU</text><rect x="634" y="728" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="730" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="748" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">TX</text><text x="1184" text-anchor="end" y="748" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 26</text><text x="634" y="778" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RX</text><text x="1184" text-anchor="end" y="778" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><rect x="56" y="894" width="1128" height="430" rx="10" fill="#fdf7e8"/><text x="76" y="918" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="942" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel or on a network. Pins are</text><text x="76" y="964" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">from Guition&#39;s own schematic for the JC1060P470C_I_W_Y (V1.0): panel reset GPIO 0, backlight GPIO 23 lit when high, the GT911 on</text><text x="76" y="986" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">GPIO 7/8 with INT 21 and RST 22, the ES8311 speaker codec (MCLK 13, BCLK 12, LRCK 10, data 9) with its amplifier on GPIO 11, the TF</text><text x="76" y="1008" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">card on SDMMC (CLK 43, CMD 44, D0-D3 39-42), RS485 through a MAX485 that turns itself round (TX 26, RX 27, the same lines as the</text><text x="76" y="1030" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">UART1 connector), and the RJ45 socket on an IP101 PHY wired to the ESP32-P4&#39;s own Ethernet pins (MDC 31, MDIO 52, reset 51, the</text><text x="76" y="1052" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">clock in on 50). Guition changed the panel in 2026: a board whose label says V2 (SKU 10153004-V2) needs the V2 start-up sequence</text><text x="76" y="1074" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">this preset starts with (52 MHz, 750 Mbps a lane, hsync 24/136/160, vsync 2/21/12, from the ESPHome community&#39;s configurations for</text><text x="76" y="1096" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">it). If yours has no V2 on its label, choose &quot;Guition JC1060P470 1024x600 (the library&#39;s table)&quot; as the start-up sequence on the</text><text x="76" y="1118" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Display tab. The wrong one shows a white screen with a band of noise. Some older configurations give the panel reset as GPIO 5,</text><text x="76" y="1140" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">which only reaches the header. GPIO 45, which the Arduino core switches as the TF card&#39;s power, is also on the 2x13 header. The</text><text x="76" y="1162" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">touch controller may answer at 0x14 instead of 0x5D. A design on this preset builds for an ESP32-P4 before revision 3, which is</text><text x="76" y="1184" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">what the community&#39;s configurations for this module build for; if the upload reports revision 3 (&quot;revision v3.1&quot;), choose that</text><text x="76" y="1206" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">under Hardware &gt; Board &gt; Chip revision. Wi-Fi is the ESP32-C6 inside the module, in the kit as the Wi-Fi co-processor on the ESP32</text><text x="76" y="1228" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">core&#39;s own SDIO lines (CLK 18, CMD 19, D0-D3 14-17, its CHIP_PU on GPIO 54), beside the cable; it has to run ESP-Hosted of the</text><text x="76" y="1250" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">core&#39;s release, which the board prints at start (see the README). The core runs that link at 40 MHz and an export cannot lower it;</text><text x="76" y="1272" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">ESPHome configurations can, so if the picture streaks or the board restarts while Wi-Fi is busy, that is the difference to suspect.</text><text x="76" y="1294" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Wi-Fi through it compiles and has not been on a board. Not driven: the ES7210 microphones, the RX8025T clock chip, the battery</text><text x="76" y="1316" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">charger (there is no battery reading), the MIPI-CSI camera connector and the C6&#39;s Bluetooth; ESP-NOW does not go through the C6.</text><text x="56" y="1370" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;guition-jc1060p470c&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1394" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/guition-jc1060p470c</text></svg>