<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="782" viewBox="0 0 1240 782"><rect width="1240" height="782" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-C6-Touch-AMOLED-1.32</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-C6   ·   CO5300 466 x 466   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - QSPI (quad SPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0 - D3</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19, 20, 10, 11</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 21</text><text x="56" y="380" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - CST820</text><rect x="56" y="394" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 8 / 7)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><rect x="626" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PWRButton (input)</text><text x="1184" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="56" y="492" width="1128" height="188" rx="10" fill="#fdf7e8"/><text x="76" y="516" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="540" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-C6-Touch-AMOLED-1.32). No pin differs between</text><text x="76" y="562" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the vendor&#39;s code and the schematic&#39;s wiring. What disagrees is inside each source: 1) Battery divider.</text><text x="76" y="584" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Example/Arduino/04_BATT_PWR_Test/src/vbat_bsp/vbat_bsp.cpp has &#39;vol = 0.001 * tage * 2&#39; (the ESP32-S3 board&#39;s file, unchanged),</text><text x="76" y="606" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">while 01_ADC_Test/adc_bsp.cpp and the ESP-IDF vbat_bsp.cpp have &#39;* 3&#39;. The schematic&#39;s R7 200K over R9 100K makes it 3: believed.</text><text x="76" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Waveshare runs this glass under orientation byte 0xC0 with the picture starting at column 6, and the preset does the same: the byte</text><text x="76" y="650" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">is on the Display tab, and a turned design is turned over it. Brightness is a command to the panel, not a backlight pin. Compiled;</text><text x="76" y="672" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">not run on a board here.</text><text x="56" y="726" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-c6-touch-amoled-132&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="750" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-c6-touch-amoled-132</text></svg>