<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000"><rect width="1240" height="1000" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">VIEWE ESP32-P4 SmartDisplay 7 inch (UEP4S070H1024V600C)</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-P4   ·   JD9165 1024 x 600   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - MIPI-DSI</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 22</text><text x="56" y="290" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="304" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="306" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="324" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="324" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="414" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="428" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="430" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="448" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="448" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 23</text><text x="56" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">WiFiCoprocessor - Wi-Fi co-processor</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="634" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="626" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="392" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="410" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RST</text><text x="1184" text-anchor="end" y="410" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 54</text><rect x="56" y="556" width="1128" height="342" rx="10" fill="#fdf7e8"/><text x="76" y="580" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="604" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel. Its panel is a JD9165 run</text><text x="76" y="626" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">under VIEWE&#39;s own register load, which the export writes into the sketch; pins and settings are from VIEWE&#39;s own board files (their</text><text x="76" y="648" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">ESP32_Display_Panel board definition and ESP-IDF BSP for the UEP4S070H1024V600C-WBA): two lanes at 600 Mbps, 50 MHz, hsync</text><text x="76" y="670" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">20/136/160, vsync 2/12/20, LCD reset GPIO 22, backlight GPIO 23 lit when high. GPIO 4 and GPIO 5 switch the panel&#39;s 1.8 V and 3.3 V</text><text x="76" y="692" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">supplies and must be raised, 30 ms apart, before the panel starts; the generated code does this. The GT911 is on GPIO 7/8 with no</text><text x="76" y="714" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">reset or interrupt line and may answer at 0x14 instead of 0x5D. The speaker is an NS4168 I2S amplifier (BCLK 33, LRCK 32, data 34)</text><text x="76" y="736" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">whose control pin, GPIO 31, is held high to play. Wi-Fi is the ESP32-C6, in the kit as the Wi-Fi co-processor on the SDIO lines</text><text x="76" y="758" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">VIEWE&#39;s own Wi-Fi example sets (CLK 18, CMD 19, D0-D3 14-17, reset 54); it has to run ESP-Hosted of the core&#39;s release, which the</text><text x="76" y="780" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">board prints at start (see the README). Wi-Fi through it compiles and has not been on a board. Not driven: the TF card, the PDM</text><text x="76" y="802" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">microphone, RS485 (VIEWE&#39;s microphone and RS485 code both name GPIO 26 and 27), the RGB LED, the camera and the C6&#39;s Bluetooth;</text><text x="76" y="824" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">ESP-NOW does not go through the C6. A design on this preset builds for an ESP32-P4 before revision 3, which VIEWE&#39;s README points</text><text x="76" y="846" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">to (it gives the processor as 360 MHz, the older chips&#39; clock); if the upload reports revision 3 (&quot;revision v3.1&quot;), choose that</text><text x="76" y="868" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">under Hardware &gt; Board &gt; Chip revision. VIEWE&#39;s BSP can also drive an EK79007 panel on the same pins (a build option whose default</text><text x="76" y="890" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">is the JD9165); if yours is one, choose the EK79007 on the Display tab.</text><text x="56" y="944" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;viewe-p4-smartdisplay-7&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="968" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/viewe-p4-smartdisplay-7</text></svg>