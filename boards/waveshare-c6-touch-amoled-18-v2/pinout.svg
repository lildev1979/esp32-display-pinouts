<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1086" viewBox="0 0 1240 1086"><rect width="1240" height="1086" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-C6-Touch-AMOLED-1.8 V2</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-C6   ·   CO5300 368 x 448   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - QSPI (quad SPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0 - D3</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1, 2, 3, 4</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 5</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 4</text><text x="56" y="380" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - CST820</text><rect x="56" y="394" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 5</text><text x="56" y="564" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 8 / 7)</text><rect x="56" y="578" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="580" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">TCA9554 (I/O expander)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Type</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x20</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 8 / 7)</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 8 / 7)</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">PMIC - AXP2101</text><rect x="634" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 8 / 7)</text><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x34</text><text x="634" y="692" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="706" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="708" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="726" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="726" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><rect x="56" y="774" width="1128" height="210" rx="10" fill="#fdf7e8"/><text x="76" y="798" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="822" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-C6-Touch-AMOLED-1.8). This is the V2 revision</text><text x="76" y="844" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(CO5300 panel, CST820 touch, 16-column offset); a V1 board (SH8601, FT3168, no offset) has the same pins and needs the other record</text><text x="76" y="866" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">- the vendor tells them apart by which touch address answers, 0x15 or 0x38. Every pin recorded here is the same in the vendor&#39;s</text><text x="76" y="888" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">code and on the schematic. The glass has rounded corners of radius 55 px: Waveshare gives none, and this is the measurement from</text><text x="76" y="910" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the owner&#39;s ESP32-S3-Touch-AMOLED-1.8 V2 (2026-10-22), the same 1.8 inch 368 x 448 AMOLED (SH8601 on V1, CO5300 with the same</text><text x="76" y="932" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">16-column gap on V2); not measured on a C6 board. On the board and not in this preset: TF card: this chip has one SPI controller</text><text x="76" y="954" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">and the panel has it (Waveshare&#39;s own code runs one or the other). Brightness is a command to the panel, not a backlight pin.</text><text x="76" y="976" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Compiled; not run on a board here.</text><text x="56" y="1030" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-c6-touch-amoled-18-v2&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1054" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-c6-touch-amoled-18-v2</text></svg>