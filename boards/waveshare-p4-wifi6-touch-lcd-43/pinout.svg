<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1182" viewBox="0 0 1240 1182"><rect width="1240" height="1182" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-P4-WIFI6-Touch-LCD-4.3</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-P4   ·   ST7701 (MIPI-DSI) 480 x 800   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - MIPI-DSI</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 27</text><text x="56" y="290" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="304" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="306" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="324" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="324" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="414" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="428" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="430" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="448" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="448" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 26</text><text x="56" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">low</text><rect x="48" y="490" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="56" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 7 / 8)</text><rect x="56" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="56" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="692" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="56" y="706" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="708" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="726" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="606" text-anchor="end" y="726" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 20</text><text x="56" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="606" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 35</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 43</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 44</text><rect x="626" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="634" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><rect x="626" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><text x="634" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="634" y="440" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">WiFiCoprocessor - Wi-Fi co-processor</text><rect x="634" y="454" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><text x="634" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 19</text><rect x="626" y="516" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="534" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="534" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14</text><text x="634" y="564" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D1</text><text x="1184" text-anchor="end" y="564" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><rect x="626" y="576" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="594" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D2</text><text x="1184" text-anchor="end" y="594" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="634" y="624" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D3</text><text x="1184" text-anchor="end" y="624" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 17</text><rect x="626" y="636" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="654" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RST</text><text x="1184" text-anchor="end" y="654" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 54</text><rect x="56" y="804" width="1128" height="276" rx="10" fill="#fdf7e8"/><text x="76" y="828" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="852" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board yet: the export for it compiles and has not been seen on the panel. Pins, the panel&#39;s</text><text x="76" y="874" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">start-up table and its settings are Waveshare&#39;s own, from their Arduino examples for this board and their ESP-IDF BSP, which agree:</text><text x="76" y="896" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the ST7701 over MIPI-DSI under Waveshare&#39;s register table, two lanes at 500 Mbps, 30 MHz, hsync 12/42/42, vsync 8/2/60, the panel&#39;s</text><text x="76" y="918" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">reset on GPIO 27 (active low), and the backlight on GPIO 26, lit when the pin is low and dimmed by PWM. A design on this preset</text><text x="76" y="940" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">starts on revision 3 of the ESP32-P4, which Waveshare&#39;s own Arduino examples for the board build for; for a chip before revision 3</text><text x="76" y="962" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(the upload says &quot;revision v1.x&quot;), choose that under Hardware &gt; Board &gt; Chip revision. The GT911 has no reset or interrupt line</text><text x="76" y="984" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">driven and may answer at 0x14 instead of 0x5D. The TF card (SDMMC, 4-bit) and the ES8311 speaker codec (amplifier on GPIO 53) are</text><text x="76" y="1006" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">in the kit, with the BOOT button (GPIO 35) and the battery voltage (GPIO 20, a third of the cell, from the schematic; no Waveshare</text><text x="76" y="1028" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">code reads it). Wi-Fi is the ESP32-C6 beside the P4, on the ESP32 core&#39;s own SDIO lines (CLK 18, CMD 19, D0-D3 14-17, reset 54),</text><text x="76" y="1050" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">which the schematic confirms; it has to run ESP-Hosted of the core&#39;s release, which the board prints at start (see the README). Not</text><text x="76" y="1072" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">driven: the two ES7210 microphones and the C6&#39;s Bluetooth; the -C version&#39;s OV5647 camera is on the I2C bus at 0x36.</text><text x="56" y="1126" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-p4-wifi6-touch-lcd-43&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1150" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-p4-wifi6-touch-lcd-43</text></svg>