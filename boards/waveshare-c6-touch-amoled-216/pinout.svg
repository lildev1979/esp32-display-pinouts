<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1220" viewBox="0 0 1240 1220"><rect width="1240" height="1220" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-C6-Touch-AMOLED-2.16</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-C6   ·   CO5300 480 x 480   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - QSPI (quad SPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0 - D3</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1, 2, 3, 4</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PMIC ALDO3</text><text x="56" y="380" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - CST9217 / CST9220</text><rect x="56" y="394" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="396" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="414" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="414" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><rect x="48" y="456" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 5</text><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 11</text><text x="56" y="564" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 8 / 7)</text><rect x="56" y="578" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="580" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="598" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="598" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 8</text><text x="56" y="628" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="628" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 8 / 7)</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 8 / 7)</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">PMIC - AXP2101</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 8 / 7)</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x34</text><text x="634" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 9</text><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">KEYButton (input)</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 10</text><rect x="626" y="644" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="662" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PWRButton (input)</text><text x="1184" text-anchor="end" y="662" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 18</text><rect x="56" y="710" width="1128" height="408" rx="10" fill="#fdf7e8"/><text x="76" y="734" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="758" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://github.com/waveshareteam/ESP32-C6-Touch-AMOLED-2.16). 1)</text><text x="76" y="780" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">02_Example/ESP-IDF-v5.5.3/*/main/user_config.h has BSP_LCD_CS GPIO_NUM_5 and BSP_LCD_TOUCH_INT GPIO_NUM_15, the reverse of the</text><text x="76" y="802" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Arduino user_config.h (CS 15, INT 5). The ESP-IDF code never uses those two defines for the panel: main.cpp builds DisplayPort with</text><text x="76" y="824" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">its defaults (cs = 15, tp_int = 5). The schematic (J4 pin 4 = GPIO15, pin 17 = GPIO5) and the Arduino header were believed. The</text><text x="76" y="846" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">panel has no reset GPIO: its reset line is pulled up to ALDO3 of the AXP2101, so the export starts the chip before the panel and</text><text x="76" y="868" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">resets the panel by switching ALDO3 off and on, as Waveshare&#39;s own code does - compiled here, and never seen on a panel. ALDO1 (the</text><text x="76" y="890" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">ES7210&#39;s and the ES8311&#39;s analogue supply, 3.3 V) and ALDO2 (the speaker amplifier&#39;s enable, 3.3 V) are switched on when the chip</text><text x="76" y="912" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">starts, as Waveshare&#39;s code has them. The speaker amplifier has no enable GPIO, so it is on whenever the board is: nothing mutes it</text><text x="76" y="934" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">between sounds. The ES8311 is set to +12 dB (Speaker gain on Hardware &gt; Audio): its amplifier has a fixed gain and the speaker was</text><text x="76" y="956" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">very quiet at 0 dB. The default was set by ear on 2026-10-20. Waveshare runs this glass under orientation byte 0xA0 with the</text><text x="76" y="978" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">picture starting at column 0, and the preset does the same: the byte is on the Display tab, and a turned design is turned over it.</text><text x="76" y="1000" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Waveshare&#39;s LVGL examples for this board send 0x30 instead (its XiaoZhi board file and the S3 board send 0xA0), with the same touch</text><text x="76" y="1022" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">arithmetic; if the picture comes out mirrored against the touch, try 0x30 there. The glass has rounded corners whose radius</text><text x="76" y="1044" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Waveshare does not give, so the designer draws them square: keep what matters out of the corners, or set a corner radius on the</text><text x="76" y="1066" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Display tab once it is measured. On the board and not in this preset: TF card: it is wired onto the panel&#39;s own quad SPI lines in a</text><text x="76" y="1088" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">way the export cannot share with the panel. Brightness is a command to the panel, not a backlight pin. Compiled; not run on a board</text><text x="76" y="1110" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">here.</text><text x="56" y="1164" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-c6-touch-amoled-216&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1188" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-c6-touch-amoled-216</text></svg>