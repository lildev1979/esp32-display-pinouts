<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1454" viewBox="0 0 1240 1454"><rect width="1240" height="1454" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-S3-Touch-LCD-2.8B</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-S3   ·   ST7701 / ST7701S 480 x 640   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - RGB565 parallel (DPI)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DE</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">VSYNC</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">HSYNC</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">PCLK</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">R0 - R4</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 46, 3, 8, 18, 17</text><text x="56" y="380" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">G0 - G5</text><text x="606" text-anchor="end" y="380" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 14, 13, 12, 11, 10, 9</text><rect x="48" y="392" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="410" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">B0 - B4</text><text x="606" text-anchor="end" y="410" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 5, 45, 48, 47, 21</text><text x="56" y="440" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS (init only)</text><text x="606" text-anchor="end" y="440" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 2</text><rect x="48" y="452" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="470" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK (init only)</text><text x="606" text-anchor="end" y="470" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="56" y="500" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI (init only)</text><text x="606" text-anchor="end" y="500" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="48" y="512" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="530" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="530" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 0</text><text x="56" y="590" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Touch - GT911</text><rect x="56" y="604" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="606" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="624" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="606" text-anchor="end" y="624" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="56" y="654" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="606" text-anchor="end" y="654" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><rect x="48" y="666" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="684" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">INT / IRQ</text><text x="606" text-anchor="end" y="684" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 16</text><text x="56" y="714" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="714" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 1</text><text x="56" y="774" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="788" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="790" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="808" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="808" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 6</text><text x="56" y="838" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="838" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="850" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="868" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="868" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 15 / 7)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 15</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 7</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">TCA9554 (I/O expander)</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Type</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x20</text><text x="634" y="444" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="458" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="460" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="478" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="478" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 7)</text><text x="634" y="508" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="508" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><text x="634" y="568" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">RTC - PCF85063</text><rect x="634" y="582" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="584" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="602" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="602" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 15 / 7)</text><text x="634" y="632" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="632" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x51</text><text x="634" y="692" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">SDCard - SD card</text><rect x="634" y="706" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="708" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="726" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CLK</text><text x="1184" text-anchor="end" y="726" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 2</text><text x="634" y="756" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CMD</text><text x="1184" text-anchor="end" y="756" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 1</text><rect x="626" y="768" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="786" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">D0</text><text x="1184" text-anchor="end" y="786" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="634" y="846" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Inputs and outputs</text><rect x="634" y="860" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="862" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="880" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Battery (analog in)</text><text x="1184" text-anchor="end" y="880" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 4</text><text x="634" y="910" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">BOOTButton (input)</text><text x="1184" text-anchor="end" y="910" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 0</text><rect x="626" y="922" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="940" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Buzzer (output)</text><text x="1184" text-anchor="end" y="940" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">TCA9554 7</text><rect x="56" y="988" width="1128" height="364" rx="10" fill="#fdf7e8"/><text x="76" y="1012" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="1036" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Nobody at LCD Wizard has had this board: the export for it compiles and has not been seen on the panel. Every pin is from</text><text x="76" y="1058" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Waveshare&#39;s schematic and their Arduino demo, which is what the board&#39;s factory firmware was built from. The panel is an ST7701</text><text x="76" y="1080" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">that shows nothing until Waveshare&#39;s own register load is sent over three wires (SDA GPIO 1, SCL GPIO 2, CS on the TCA9554&#39;s</text><text x="76" y="1102" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">EXIO3); the sketch selects it for the load inside the panel&#39;s begin() and lets it go after, because the TF card uses the same two</text><text x="76" y="1124" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">GPIOs (SDMMC 1-bit: CLK 2, CMD 1, D0 42, D3 held high on EXIO4) and is mounted after the panel. Only GFX Library for Arduino sends</text><text x="76" y="1146" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">that load. The pixel clock is Waveshare&#39;s 30 MHz with their porches (hsync 10/70/60, vsync 10/20/20); they run it on a core of</text><text x="76" y="1168" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">their own that keeps code in PSRAM, so if the picture shimmers or drifts, lower the pixel clock on the Display tab (16 to 20 MHz)</text><text x="76" y="1190" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">before anything else. Touch (GT911, 0x5D, INT GPIO 16, reset EXIO2), the expander (0x20), the IMU (QMI8658, 0x6B) and the RTC</text><text x="76" y="1212" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(PCF85063, 0x51) share I2C on GPIO 15/7. The panel&#39;s reset is EXIO1 and the backlight is GPIO 6 (PWM). The battery reads on GPIO 4</text><text x="76" y="1234" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">through a divide-by-three. The buzzer is EXIO8, a digital output called Buzzer on Hardware &gt; I/O: on sounds it. It starts silent -</text><text x="76" y="1256" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">the export writes the line low before it makes it an output, since a TCA9554 line made an output starts high. There is no audio</text><text x="76" y="1278" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">chip, speaker or microphone: the buzzer is the board&#39;s only sound, so the Internet Radio and anything else that plays needs an I2S</text><text x="76" y="1300" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">amplifier (a MAX98357A and a small speaker) wired by hand to free pins - GPIO 43 and 44 on the UART header and GPIO 0 (the BOOT</text><text x="76" y="1322" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">button&#39;s, which then cannot be pressed while it plays) - and set under Hardware &gt; Audio. The IMU&#39;s and the RTC&#39;s interrupts</text><text x="76" y="1344" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">(EXIO5-7) are not used. The ESP32-S3-LCD-2.8B is the same board without touch: set Touch to None.</text><text x="56" y="1398" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-touch-lcd-28b&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="1422" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-touch-lcd-28b</text></svg>