xt><rect x="626" y="426" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="1184" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><rect x="56" y="492" width="1128" height="56" rx="10" fill="#fdf7e8"/><text x="76" y="516" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="540" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">CS is tied low on the board, so leave it at -1.</text><text x="56" y="594" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;wt32-sc01-plus&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="618" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/wt32-sc01-plus</text></svg>