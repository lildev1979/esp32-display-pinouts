<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="754" viewBox="0 0 1240 754"><rect width="1240" height="754" fill="#ffffff"/><rect x="0" y="0" width="1240" height="8" fill="#0b7d4e"/><text x="56" y="66" font-family="Montserrat" font-weight="700" font-size="15" letter-spacing="3" fill="#0b7d4e">LCD WIZARD  ·  PINOUT</text><text x="56" y="104" font-family="Montserrat" font-weight="700" font-size="30" fill="#0d1513">Waveshare ESP32-S3-LCD-1.3</text><text x="56" y="130" font-family="Montserrat" font-weight="500" font-size="16" fill="#4a5a55">ESP32-S3   ·   ST7789 240 x 240   ·   GFX Library for Arduino   ·   16-bit colour</text><rect x="56" y="162" width="1128" height="1" fill="#dbe3df"/><text x="56" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Panel - SPI (4-wire serial)</text><rect x="56" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCK / CLK</text><text x="606" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 40</text><text x="56" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">MOSI / SDA</text><text x="606" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 41</text><rect x="48" y="272" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="290" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">CS</text><text x="606" text-anchor="end" y="290" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 39</text><text x="56" y="320" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">DC / RS</text><text x="606" text-anchor="end" y="320" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 38</text><rect x="48" y="332" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="350" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">RESET</text><text x="606" text-anchor="end" y="350" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 42</text><text x="56" y="410" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">Backlight</text><rect x="56" y="424" width="550" height="2" fill="#0b7d4e"/><rect x="48" y="426" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="444" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Pin</text><text x="606" text-anchor="end" y="444" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 20</text><text x="56" y="474" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Active</text><text x="606" text-anchor="end" y="474" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">high</text><rect x="48" y="486" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="56" y="504" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Drive</text><text x="606" text-anchor="end" y="504" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">PWM 5000 Hz</text><text x="634" y="196" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">I2C (GPIO 47 / 48)</text><rect x="634" y="210" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="212" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="230" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SDA</text><text x="1184" text-anchor="end" y="230" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 47</text><text x="634" y="260" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">SCL</text><text x="1184" text-anchor="end" y="260" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">GPIO 48</text><text x="634" y="320" font-family="Montserrat" font-weight="700" font-size="17" fill="#0d1513">IMU - QMI8658</text><rect x="634" y="334" width="550" height="2" fill="#0b7d4e"/><rect x="626" y="336" width="566" height="30" rx="6" fill="#f4f7f5"/><text x="634" y="354" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Bus</text><text x="1184" text-anchor="end" y="354" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">I2C (GPIO 47 / 48)</text><text x="634" y="384" font-family="Montserrat" font-weight="500" font-size="15" fill="#4a5a55">Address</text><text x="1184" text-anchor="end" y="384" font-family="Montserrat" font-weight="700" font-size="15" fill="#0d1513">0x6B</text><rect x="56" y="552" width="1128" height="100" rx="10" fill="#fdf7e8"/><text x="76" y="576" font-family="Montserrat" font-weight="700" font-size="15" fill="#8a6412">Check your revision</text><text x="76" y="600" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Pins from Waveshare&#39;s demo code and schematic (https://files.waveshare.com/wiki/ESP32-S3-LCD-1.3/ESP32-S3-LCD-1.3-Demo.zip).</text><text x="76" y="622" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Backlight: ESP-IDF main.c defines PIN_NUM_BL 4 and drives it high, but the same demo&#39;s pwm_init() drives lcd_bl=20, the Arduino</text><text x="76" y="644" font-family="Montserrat" font-weight="500" font-size="15" fill="#6b5312">Prism demo uses LCD_BL 20, and the schematic labels GPIO20 BL_PWM (NPN low-side switch, so active high).</text><text x="56" y="698" font-family="Montserrat" font-weight="500" font-size="14" fill="#687570">Generated from the LCD Wizard board preset &quot;waveshare-s3-lcd-13&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" text-anchor="end" y="722" font-family="Montserrat" font-weight="700" font-size="14" fill="#0b7d4e">lcdwizard.com/boards/waveshare-s3-lcd-13</text></svg>